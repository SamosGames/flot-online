<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <!--
        SPDX-FileCopyrightText: 2024 Softbear, Inc.
        SPDX-License-Identifier: AGPL-3.0-or-later
    -->

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
    <title>Флот Онлайн — морской бой</title>
    <meta name="description" content="Онлайн-морской бой: управляйте кораблём, собирайте ящики, улучшайтесь и топите соперников. Играйте бесплатно в браузере.">
    <meta name="keywords" content="морской бой, корабли, подводная лодка, торпеды, онлайн игра, флот">
    <meta name="theme-color" content="#00487d">
    <meta property="og:title" content="Флот Онлайн — морской бой"/>
    <meta name="og:description" content="Онлайн-морской бой: управляйте кораблём, улучшайтесь и топите соперников.">
    <meta property="og:type" content="website"/>
    <meta property="og:image" content="/data/1280x720.png"/>
    <link data-trunk rel="icon" type="image/png" href="/data/favicon.png">
    <link rel="manifest" href="/data/manifest.json">
    <script data-trunk src="yandex-sdk.js"></script>
    <script>
        function request_pointer_lock_with_unadjusted_movement(e) {
            const promise = e.requestPointerLock({unadjustedMovement: true});
            if (promise) {
                promise.catch(er => {
                    if (er.name === "NotSupportedError") {
                        e.requestPointerLock();
                    }
                });
            }
        }
    </script>
    <link data-trunk rel="rust" data-wasm-opt="z" data-no-demangle/>
    <link data-trunk rel="copy-dir" href="data/">
    

    <script>
        try {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for (const registration of registrations) {
                    registration.unregister();
                }
            });
        } catch (e) {
            console.log(e);
        }

        function startLoadInterval() {
            let time = 0;
            let warning = document.getElementById("load_warning");
            let warningText = document.getElementById("load_warning_text");
            const interval = setInterval(() => {
                if (document.getElementById("canvas")) {
                    // Loaded.
                    clearInterval(interval);
                    const boot = document.getElementById("flot_online_boot");
                    if (boot) {
                        boot.classList.add("flot_online_boot_hidden");
                        setTimeout(() => boot.remove(), 300);
                    }
                    if (warning && warning.style) {
                        warning.style.display = "none";
                    }
                    return;
                }

                if (time > 5) {
                    warning.style.display = "initial";
                    warningText.innerText = `Загрузка занимает больше времени, чем обычно (${Math.floor(time)} с)`;
                }
                time += 0.5;
            }, 500);
        }
    </script>
</head>
<body style="background-color: #00487d;" onload="startLoadInterval()">
    <div id="flot_online_boot" role="status" aria-live="polite">
        <div id="flot_online_boot_card">
            <strong>ФЛОТ ОНЛАЙН</strong>
            <span>Подготовка к бою…</span>
        </div>
    </div>
    <div id="load_warning" style="display: none; font-family: sans-serif; padding: 1rem; color: white; position: absolute; left: 50%; text-align: center; top: 50%; transform: translate(-50%, -50%);">
        <h2 style="margin-top: 0;" id="load_warning_text"></h2>
        <button onclick="window.location.reload()" style="width: 10rem; height: 3rem; border-radius: 0.5rem; background-color: #505050; border: 2px solid #606060; color: white; font-size: 1.2rem; cursor: pointer;">Повторить</button>
    </div>
    <style>
        #flot_online_boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: linear-gradient(180deg, rgba(0, 35, 63, .2), rgba(0, 13, 25, .78)), url("/data/loading-1280x720.png") center / cover, url("/data/1280x720.png") center / cover; transition: opacity .25s ease; }
        #flot_online_boot_card { display: grid; gap: .35rem; padding: 1rem 1.35rem; border: 1px solid rgba(255, 255, 255, .35); border-radius: .65rem; color: #fff; background: rgba(0, 29, 52, .72); box-shadow: 0 .8rem 3rem rgba(0, 0, 0, .35); font: 600 1.05rem/1.2 system-ui, sans-serif; text-align: center; }
        #flot_online_boot_card span { color: #cde7f8; font-size: .85rem; font-weight: 400; }
        .flot_online_boot_hidden { opacity: 0; pointer-events: none; }
    </style>
</body>
</html>
